<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube RSS Feed Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --primary: #ff0000;
            --text: #ffffff;
            --muted: #888888;
            --input-bg: #252525;
            --input-border: #333333;
            --success: #00ff88;
            --error: #ff4444;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .logo svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--muted);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.2);
        }

        button {
            padding: 14px 28px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 600;
            background: var(--primary);
            color: var(--text);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
            outline: none;
        }

        button:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .full-width {
            width: 100%;
        }

        .result {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .result-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--success);
            margin-bottom: 8px;
        }

        .channel-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .rss-url-group {
            display: flex;
            gap: 8px;
        }

        .rss-url {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            color: var(--text);
            word-break: break-all;
            display: flex;
            align-items: center;
        }

        .copy-btn {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            background: var(--success);
            color: #000;
        }

        .copy-btn.copied {
            background: var(--text);
        }

        .error {
            display: none;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--error);
            font-size: 14px;
        }

        .error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M23.498 6.186a3.013 3.013 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.013 3.013 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.013 3.013 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.013 3.013 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                <h1>RSS Feed Scanner</h1>
            </div>
            <p class="subtitle">Generate official RSS feeds from any YouTube channel</p>
        </header>

        <main>
            <div class="input-group">
                <input 
                    type="text" 
                    id="channelUrl" 
                    placeholder="Paste YouTube channel URL here..."
                    autocomplete="off"
                >
                <button class="full-width" id="scanBtn">Get RSS Feed</button>
            </div>

            <div class="result" id="result">
                <div class="result-card">
                    <div class="result-label">RSS Feed URL</div>
                    <div class="channel-name" id="channelName"></div>
                    <div class="rss-url-group">
                        <div class="rss-url" id="rssUrl"></div>
                        <button class="copy-btn" id="copyBtn">Copy</button>
                    </div>
                </div>
            </div>

            <div class="error" id="error"></div>
        </main>

        <footer>
            Uses <a href="https://www.youtube.com/feeds/videos.xml" target="_blank" rel="noopener">YouTube's Official RSS Feed</a>
        </footer>
    </div>

    <script>
        const channelUrlInput = document.getElementById('channelUrl');
        const scanBtn = document.getElementById('scanBtn');
        const resultDiv = document.getElementById('result');
        const channelNameEl = document.getElementById('channelName');
        const rssUrlEl = document.getElementById('rssUrl');
        const copyBtn = document.getElementById('copyBtn');
        const errorDiv = document.getElementById('error');

        const patterns = [
            { regex: /\/channel\/([a-zA-Z0-9_-]{22})/, type: 'channel' },
            { regex: /\/c\/([a-zA-Z0-9_-]+)/, type: 'custom' },
            { regex: /\/user\/([a-zA-Z0-9_-]+)/, type: 'user' },
            { regex: /\/@([a-zA-Z0-9_-]+)/, type: 'handle' }
        ];

        async function extractChannelId(url) {
            let channelId = null;
            let urlType = null;

            for (const pattern of patterns) {
                const match = url.match(pattern.regex);
                if (match) {
                    channelId = match[1];
                    urlType = pattern.type;
                    break;
                }
            }

            if (urlType === 'channel' && channelId) {
                return { channelId, channelName: null };
            }

            if ((urlType === 'custom' || urlType === 'user' || urlType === 'handle') && channelId) {
                try {
                    const response = await fetch(url, {
                        headers: { 'Accept-Language': 'en-US,en;q=0.9' }
                    });
                    
                    if (response.ok) {
                        const html = await response.text();
                        const channelIdMatch = html.match(/"channelId":"([a-zA-Z0-9_-]{22})"/);
                        if (channelIdMatch) {
                            return { channelId: channelIdMatch[1], channelName: null };
                        }
                    }
                } catch (e) {
                    console.error('Error fetching channel page:', e);
                }
                
                return await fetchChannelIdByUsername(channelId);
            }

            return null;
        }

        async function fetchChannelIdByUsername(username) {
            try {
                const channelUrl = 'https://www.youtube.com/@' + username;
                const response = await fetch(channelUrl);
                
                if (response.ok) {
                    const html = await response.text();
                    const channelIdMatch = html.match(/"channelId":"([a-zA-Z0-9_-]{22})"/);
                    if (channelIdMatch) {
                        const nameMatch = html.match(/"channelName":"([^"]+)"/);
                        const channelName = nameMatch ? nameMatch[1] : '@' + username;
                        return { channelId: channelIdMatch[1], channelName };
                    }
                }
            } catch (e) {
                console.error('Error fetching channel page:', e);
            }

            return null;
        }

        async function getRssFeed(inputUrl) {
            if (!inputUrl || !inputUrl.trim()) {
                throw new Error('Please enter a YouTube channel URL');
            }

            let url = inputUrl.trim();
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            if (!url.includes('youtube.com')) {
                throw new Error('Invalid YouTube channel URL');
            }

            let result = await extractChannelId(url);
            
            if (!result || !result.channelId) {
                throw new Error('Could not find valid channel ID from the URL');
            }

            const rssFeedUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + result.channelId;

            return {
                rssFeedUrl,
                channelId: result.channelId,
                channelName: result.channelName
            };
        }

        scanBtn.addEventListener('click', async () => {
            const url = channelUrlInput.value;
            
            resultDiv.classList.remove('show');
            errorDiv.classList.remove('show');
            
            scanBtn.disabled = true;
            scanBtn.textContent = 'Scanning...';

            try {
                const result = await getRssFeed(url);
                
                channelNameEl.textContent = result.channelName || result.channelId;
                rssUrlEl.textContent = result.rssFeedUrl;
                resultDiv.classList.add('show');
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            } finally {
                scanBtn.disabled = false;
                scanBtn.textContent = 'Get RSS Feed';
            }
        });

        copyBtn.addEventListener('click', async () => {
            const rssUrl = rssUrlEl.textContent;
            
            try {
                await navigator.clipboard.writeText(rssUrl);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (error) {
                const textarea = document.createElement('textarea');
                textarea.value = rssUrl;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }
        });

        channelUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scanBtn.click();
            }
        });
    </script>
</body>
</html>
