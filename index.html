<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube RSS Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            display: none;
        }
        .channel-info { margin-bottom: 15px; }
        .channel-info p { margin: 5px 0; color: #aaa; }
        .channel-info strong { color: #fff; }
        .feed-link {
            word-break: break-all;
            padding: 10px;
            background: #333;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 13px;
            color: #4fc3f7;
        }
        .feed-row { margin-bottom: 10px; }
        .copy-btn {
            margin-top: 6px;
            width: auto;
            padding: 7px 10px;
            font-size: 12px;
            background: #444;
        }
        .feed-label { color: #aaa; font-size: 12px; margin-bottom: 4px; }
        .atom-output {
            margin-top: 15px;
        }
        .atom-output textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            background: #333;
            color: #4fc3f7;
            border: none;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
        }
        .error {
            background: #4a2020;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e7f3f;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>YouTube RSS Scanner</h1>
    
    <div class="input-group">
        <label>YouTube Channel URL</label>
        <input type="text" id="channelUrl" placeholder="https://www.youtube.com/@channel or https://www.youtube.com/c/username">
    </div>
    
    <div class="input-group">
        <label>Feed Type</label>
        <select id="feedType">
            <option value="all">All (combined)</option>
            <option value="videos">Videos only</option>
            <option value="shorts">Shorts only</option>
            <option value="live">Live streams only</option>
        </select>
    </div>

    <button id="getFeedBtn" onclick="getFeed()">Get RSS Feed</button>
    <div class="input-group" style="margin-top: 12px;">
        <label>
            <input type="checkbox" id="includeApiEndpoints" style="width:auto; margin-right:8px;">
            Include API endpoints
        </label>
    </div>
    <div class="input-group">
        <label>Discord Webhook URL (optional)</label>
        <input type="text" id="discordWebhookUrl" placeholder="https://discord.com/api/webhooks/...">
    </div>
    
    <div id="result"></div>
    
    <p class="note">Enter a YouTube channel URL to get its RSS feed</p>
    <div id="toast" class="toast"></div>
    
    <script>
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#8a1f1f' : '#1e7f3f';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1600);
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('Copied!');
            } catch {
                showToast('Clipboard copy failed.', true);
            }
        }

        async function getFeed() {
            const url = document.getElementById('channelUrl').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('getFeedBtn');

            if (!url) {
                resultDiv.innerHTML = '';
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = 'Please enter a YouTube channel URL';
                resultDiv.appendChild(errorDiv);
                resultDiv.style.display = 'block';
                return;
            }

            if (!url.startsWith('http')) {
                resultDiv.innerHTML = '';
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = 'Please enter a full URL (e.g., https://www.youtube.com/@channel)';
                resultDiv.appendChild(errorDiv);
                resultDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Loading...';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/feed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        include_api_endpoints: document.getElementById('includeApiEndpoints').checked,
                        feed_type: document.getElementById('feedType').value,
                        discord_webhook_url: document.getElementById('discordWebhookUrl').value.trim()
                    })
                });
                
                const data = await response.json();
                const selectedFeedUrl = data.selected_feed_path ? `${window.location.origin}${data.selected_feed_path}` : (data.selected_feed || data.youtube_rss);

                if (data.error) {
                    resultDiv.innerHTML = '';
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error';
                    errorDiv.textContent = data.error;
                    resultDiv.appendChild(errorDiv);
                } else {
                    resultDiv.innerHTML = '';
                    // Channel info
                    const channelInfo = document.createElement('div');
                    channelInfo.className = 'channel-info';

                    if (data.channel_name) {
                        const channelP = document.createElement('p');
                        const channelStrong = document.createElement('strong');
                        channelStrong.textContent = 'Channel: ';
                        channelP.appendChild(channelStrong);
                        channelP.appendChild(document.createTextNode(data.channel_name));
                        channelInfo.appendChild(channelP);
                    }

                    const idP = document.createElement('p');
                    const idStrong = document.createElement('strong');
                    idStrong.textContent = 'Channel ID: ';
                    idP.appendChild(idStrong);
                    idP.appendChild(document.createTextNode(data.channel_id));
                    channelInfo.appendChild(idP);
                    resultDiv.appendChild(channelInfo);

                    // YouTube RSS
                    const feedRow = document.createElement('div');
                    feedRow.className = 'feed-row';

                    const feedLabel = document.createElement('div');
                    feedLabel.className = 'feed-label';
                    feedLabel.textContent = 'Selected RSS Feed:';
                    feedRow.appendChild(feedLabel);

                    const feedLink = document.createElement('div');
                    feedLink.className = 'feed-link';
                    feedLink.textContent = (data.selected_feed || data.youtube_rss);
                    feedRow.appendChild(feedLink);

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = 'Copy Selected RSS';
                    copyBtn.addEventListener('click', () => copyText((data.selected_feed || data.youtube_rss)));
                    feedRow.appendChild(copyBtn);
                    resultDiv.appendChild(feedRow);
                    if (data.official_feeds) {
                        const officialBox = document.createElement('div');
                        officialBox.className = 'atom-output';
                        const label = document.createElement('div');
                        label.className = 'feed-label';
                        label.textContent = 'Official YouTube Feeds:';
                        officialBox.appendChild(label);
                        ['selected','all','videos','shorts','live'].forEach((key) => {
                            if (!data.official_feeds[key]) return;
                            const row = document.createElement('div');
                            row.className = 'feed-row';

                            const feedLabel = document.createElement('div');
                            feedLabel.className = 'feed-label';
                            feedLabel.textContent = `Official (${key}):`;
                            row.appendChild(feedLabel);

                            const feedLink = document.createElement('div');
                            feedLink.className = 'feed-link';
                            feedLink.textContent = data.official_feeds[key];
                            row.appendChild(feedLink);

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'copy-btn';
                            copyBtn.textContent = `Copy ${key} RSS`;
                            copyBtn.addEventListener('click', () => copyText(data.official_feeds[key]));
                            row.appendChild(copyBtn);

                            officialBox.appendChild(row);
                        });
                        resultDiv.appendChild(officialBox);
                    }



                    // API endpoints
                    if (data.api_endpoints && Object.keys(data.api_endpoints).length > 0) {
                        const apiOutput = document.createElement('div');
                        apiOutput.className = 'atom-output';

                        const apiLabel = document.createElement('div');
                        apiLabel.className = 'feed-label';
                        apiLabel.textContent = 'API Endpoints:';
                        apiOutput.appendChild(apiLabel);

                        const jsonApiDiv = document.createElement('div');
                        jsonApiDiv.className = 'feed-link';
                        jsonApiDiv.textContent = 'POST JSON: ' + data.api_endpoints.json_api;
                        apiOutput.appendChild(jsonApiDiv);

                        resultDiv.appendChild(apiOutput);
                    }

                    if (data.discord) {
                        const discordRow = document.createElement('div');
                        discordRow.className = 'feed-row';

                        const discordLabel = document.createElement('div');
                        discordLabel.className = 'feed-label';
                        discordLabel.textContent = 'Discord Webhook:';
                        discordRow.appendChild(discordLabel);

                        const discordLink = document.createElement('div');
                        discordLink.className = 'feed-link';
                        if (data.discord.ok) {
                            discordLink.textContent = 'Notification sent successfully (HTTP ' + data.discord.status + ').';
                        } else {
                            discordLink.textContent = 'Failed to send notification: ' + (data.discord.error || ('HTTP ' + data.discord.status));
                        }
                        discordRow.appendChild(discordLink);
                        resultDiv.appendChild(discordRow);
                    }
                }
            } catch (e) {
                resultDiv.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
            }
            
            btn.disabled = false;
            btn.textContent = 'Get RSS Feed';
            resultDiv.style.display = 'block';
        }
        
        document.getElementById('channelUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') getFeed();
        });
    </script>
</body>
</html>
