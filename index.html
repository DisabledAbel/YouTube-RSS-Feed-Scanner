<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube RSS Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            display: none;
        }
        .channel-info { margin-bottom: 15px; }
        .channel-info p { margin: 5px 0; color: #aaa; }
        .channel-info strong { color: #fff; }
        .feed-link {
            word-break: break-all;
            padding: 10px;
            background: #333;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 13px;
            color: #4fc3f7;
        }
        .feed-label { color: #aaa; font-size: 12px; margin-bottom: 4px; }
        .atom-output {
            margin-top: 15px;
        }
        .atom-output textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            background: #333;
            color: #4fc3f7;
            border: none;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
        }
        .error {
            background: #4a2020;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
        }
        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .preset-btn {
            width: auto;
            padding: 8px 12px;
            font-size: 13px;
            background: #333;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>YouTube RSS Scanner</h1>
    
    <div class="input-group">
        <label>YouTube Channel URL</label>
        <input type="text" id="channelUrl" placeholder="https://www.youtube.com/@channel">
    </div>
    
    <div class="presets">
        <button class="preset-btn" onclick="setPreset('@Beardmeatsfood')">@Beardmeatsfood</button>
        <button class="preset-btn" onclick="setPreset('@MKBHD')">@MKBHD</button>
        <button class="preset-btn" onclick="setPreset('@MrBeast')">@MrBeast</button>
    </div>
    
    <button id="getFeedBtn" onclick="getFeed()">Get RSS Feed</button>
    
    <div id="result"></div>
    
    <p class="note">Enter a YouTube channel URL to get its RSS feed</p>
    
    <script>
        function setPreset(channel) {
            document.getElementById('channelUrl').value = 'https://www.youtube.com/' + channel;
        }
        
        async function getFeed() {
            const url = document.getElementById('channelUrl').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('getFeedBtn');
            
            if (!url) {
                resultDiv.innerHTML = '<div class="error">Please enter a YouTube channel URL</div>';
                resultDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Loading...';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/feed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                // Clear previous content
                resultDiv.innerHTML = '';

                if (data.error) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error';
                    errorDiv.textContent = data.error;
                    resultDiv.appendChild(errorDiv);
                } else {
                    // Channel info section
                    const channelInfoDiv = document.createElement('div');
                    channelInfoDiv.className = 'channel-info';

                    if (data.channel_name) {
                        const namePara = document.createElement('p');
                        const nameStrong = document.createElement('strong');
                        nameStrong.textContent = 'Channel:';
                        namePara.appendChild(nameStrong);
                        namePara.appendChild(document.createTextNode(' ' + data.channel_name));
                        channelInfoDiv.appendChild(namePara);
                    }

                    const idPara = document.createElement('p');
                    const idStrong = document.createElement('strong');
                    idStrong.textContent = 'Channel ID:';
                    idPara.appendChild(idStrong);
                    idPara.appendChild(document.createTextNode(' ' + data.channel_id));
                    channelInfoDiv.appendChild(idPara);

                    resultDiv.appendChild(channelInfoDiv);

                    // YouTube RSS section
                    const rssLabel = document.createElement('div');
                    rssLabel.className = 'feed-label';
                    rssLabel.textContent = 'YouTube RSS (often broken):';
                    resultDiv.appendChild(rssLabel);

                    const rssLink = document.createElement('div');
                    rssLink.className = 'feed-link';
                    rssLink.textContent = data.youtube_rss;
                    resultDiv.appendChild(rssLink);

                    // Atom feed section
                    if (data.atom_feed) {
                        const atomOutputDiv = document.createElement('div');
                        atomOutputDiv.className = 'atom-output';

                        const atomLabel = document.createElement('div');
                        atomLabel.className = 'feed-label';
                        atomLabel.textContent = 'Atom Feed (' + data.video_count + ' videos):';
                        atomOutputDiv.appendChild(atomLabel);

                        const textarea = document.createElement('textarea');
                        textarea.readOnly = true;
                        textarea.value = data.atom_feed;
                        atomOutputDiv.appendChild(textarea);

                        resultDiv.appendChild(atomOutputDiv);
                    }
                }
            } catch (e) {
                resultDiv.innerHTML = '';
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = 'Error: ' + e.message;
                resultDiv.appendChild(errorDiv);
            }
            
            btn.disabled = false;
            btn.textContent = 'Get RSS Feed';
            resultDiv.style.display = 'block';
        }
        
        document.getElementById('channelUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') getFeed();
        });
    </script>
</body>
</html>
