<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube RSS Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            display: none;
        }
        .channel-info { margin-bottom: 15px; }
        .channel-info p { margin: 5px 0; color: #aaa; }
        .channel-info strong { color: #fff; }
        .feed-link {
            word-break: break-all;
            padding: 10px;
            background: #333;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 13px;
            color: #4fc3f7;
        }
        .feed-row { margin-bottom: 10px; }
        .copy-btn {
            margin-top: 6px;
            width: auto;
            padding: 7px 10px;
            font-size: 12px;
            background: #444;
        }
        .feed-label { color: #aaa; font-size: 12px; margin-bottom: 4px; }
        .atom-output {
            margin-top: 15px;
        }
        .atom-output textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            background: #333;
            color: #4fc3f7;
            border: none;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
        }
        .error {
            background: #4a2020;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e7f3f;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>YouTube RSS Scanner</h1>
    
    <div class="input-group">
        <label>YouTube Channel URL</label>
        <input type="text" id="channelUrl" placeholder="https://www.youtube.com/@channel or https://www.youtube.com/c/username">
    </div>
    
    <div class="input-group">
        <label>Feed Type</label>
        <select id="feedType">
            <option value="all">All (combined)</option>
            <option value="videos">Videos only</option>
            <option value="shorts">Shorts only</option>
            <option value="live">Live streams only</option>
        </select>
    </div>

    <button id="getFeedBtn" onclick="getFeed()">Get RSS Feed</button>
    <div class="input-group" style="margin-top: 12px;">
        <label>
            <input type="checkbox" id="includeApiEndpoints" style="width:auto; margin-right:8px;">
            Include API endpoints
        </label>
    </div>
    
    <div id="result"></div>
    
    <p class="note">Enter a YouTube channel URL to get its RSS feed</p>
    <div id="toast" class="toast"></div>
    
    <script>
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#8a1f1f' : '#1e7f3f';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1600);
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('Copied!');
            } catch {
                showToast('Clipboard copy failed.', true);
            }
        }

        function copyEncodedText(encodedText) {
            copyText(decodeURIComponent(encodedText));
        }

        async function getFeed() {
            const url = document.getElementById('channelUrl').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('getFeedBtn');
            
            if (!url) {
                resultDiv.innerHTML = '<div class="error">Please enter a YouTube channel URL</div>';
                resultDiv.style.display = 'block';
                return;
            }
            
            if (!url.startsWith('http')) {
                resultDiv.innerHTML = '<div class="error">Please enter a full URL (e.g., https://www.youtube.com/@channel)</div>';
                resultDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Loading...';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/feed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        include_api_endpoints: document.getElementById('includeApiEndpoints').checked,
                        feed_type: document.getElementById('feedType').value
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.innerHTML = '<div class="error">' + data.error + '</div>';
                } else {
                    let html = '<div class="channel-info">';
                    if (data.channel_name) {
                        html += '<p><strong>Channel:</strong> ' + data.channel_name + '</p>';
                    }
                    html += '<p><strong>Channel ID:</strong> ' + data.channel_id + '</p>';
                    html += '</div>';
                    
                    html += '<div class="feed-row"><div class="feed-label">YouTube RSS:</div>';
                    html += '<div class="feed-link">' + data.youtube_rss + '</div>';
                    html += '<button class="copy-btn" data-encoded="' + encodeURIComponent(data.youtube_rss) + '">Copy YouTube RSS</button></div>';
                    
                    if (data.api_endpoints && Object.keys(data.api_endpoints).length > 0) {
                        html += '<div class="atom-output"><div class="feed-label">API Endpoints:</div>';
                        html += '<div class="feed-link">POST JSON: ' + data.api_endpoints.json_api + '</div>';
                        if (data.api_endpoints.atom_feed_path) { html += '<div class="feed-link">Selected Feed: ' + data.api_endpoints.atom_feed_path + '</div>'; }
                        html += '</div>';
                    }
                    
                    resultDiv.innerHTML = html;

                    // Attach event listeners to copy buttons
                    resultDiv.querySelectorAll('.copy-btn').forEach(button => {
                        button.addEventListener('click', function() {
                            copyEncodedText(this.dataset.encoded);
                        });
                    });
                }
            } catch (e) {
                resultDiv.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
            }
            
            btn.disabled = false;
            btn.textContent = 'Get RSS Feed';
            resultDiv.style.display = 'block';
        }
        
        document.getElementById('channelUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') getFeed();
        });
    </script>
</body>
</html>
